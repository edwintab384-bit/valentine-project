<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Sacramento&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

    <!-- 🎵 Background Music -->
    <audio id="bg-music" loop>
        <source src="public/music/dildara.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="container">
        <div id="proposal-card">
            <h1 class="header_text">Will you be my Valentine?</h1>
            <p class="sub_text">Choose wisely... 💘</p>

            <div class="buttons">
                <button class="btn btn-yes" id="yesBtn" onclick="nextPage()">Yes! 💖</button>
                <button class="btn btn-no" id="noBtn" onclick="handleNoClick()">No </button>
            </div>

            <p class="hint">Hint: The "No" button is a bit shy... 😉</p>
        </div>

        <div id="success-card" class="hidden">
            <h1 class="header_text">Yay! Good Choice!</h1>

            <div class="img-container">
                <img src="public/images/image.jpeg" alt="Happy Couple" class="success-img">
            </div>

            <div class="message-box">
                <p class="message-title">I knew you'd say yes! 💕</p>
                <p>
                    You've made me the happiest person in the world.
                    Can't wait to celebrate this special day with you! 🌹
                </p>
                <div class="hearts">❤️❤️❤️</div>
            </div>
        </div>
    </div>

    <!-- Your JS -->
    <script src="script.js"></script>

<!-- force redeploy -->

</body>


</html>
